name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup the Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'

      # 3. Get Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Generate necessary Hive adapters (since you use build_runner)
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # 5. Build the Flutter Web application
      # IMPORTANT: The base-href MUST match your GitHub repository name exactly, with trailing and leading slashes.
      - name: Build Web
        run: flutter build web --release --base-href "/ATOMID/"

      # 6. Deploy the generated build/web folder to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
