name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned so the toolchain cannot change under the build.
env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The cloud half of the security model. Runs separately because it needs the
  # Firestore emulator — and therefore a JVM — rather than the Flutter
  # toolchain. Without this, a rule change that widened access to every
  # account's data would reach production with nothing to catch it.
  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The emulator is a Java process; the runner image ships a JDK, but pin
      # it so a base-image change cannot silently remove it. 21 rather than 17
      # because firebase-tools 15 drops support for anything below it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The emulator jar is ~60MB and is otherwise re-downloaded on every run.
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install rules-test dependencies
        run: npm ci

      - name: Test firestore.rules against the emulator
        run: npm run test:rules

  # Proof that a shippable artifact can actually be produced.
  #
  # Analysis and tests passing says the code is sound; it says nothing about
  # whether the thing can be packaged. These two jobs exist because a release
  # build can fail on things the test suite never touches — a plugin that will
  # not compile for the target, a missing native dependency, a Gradle or
  # MSBuild toolchain change — and the first time that should be discovered is
  # here, not on release day.
  #
  # Gated on `verify` so a broken commit does not burn build minutes.
  build-android:
    name: Build Android release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      # No keystore on CI, so these are debug-signed. That is deliberate: the
      # job verifies the build *compiles and packages*, which is what breaks
      # unnoticed. Signing is a release-time concern and the real keystore must
      # never live in CI secrets for an app this size — see README.
      #
      # The AAB is built too because Play accepts only that format, and it
      # takes a different code path from the APK.
      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      # Windows runners have symlink support, which a local developer machine
      # only has with Developer Mode enabled. This job is therefore the
      # authoritative Windows build: it does not depend on how one workstation
      # happens to be configured.
      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
