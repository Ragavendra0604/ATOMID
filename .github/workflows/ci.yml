name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned so the toolchain cannot change under the build.
env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The cloud half of the security model. Runs separately because it needs the
  # Firestore emulator — and therefore a JVM — rather than the Flutter
  # toolchain. Without this, a rule change that widened access to every
  # account's data would reach production with nothing to catch it.
  firestore-rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The emulator is a Java process; the runner image ships a JDK, but pin
      # it so a base-image change cannot silently remove it. 21 rather than 17
      # because firebase-tools 15 drops support for anything below it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The emulator jar is ~60MB and is otherwise re-downloaded on every run.
      - name: Cache the Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install rules-test dependencies
        run: npm ci

      - name: Test firestore.rules against the emulator
        run: npm run test:rules
